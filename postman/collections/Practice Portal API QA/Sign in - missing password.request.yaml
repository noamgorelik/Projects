$kind: http-request
url: "{{baseUrl}}/api/login"
method: POST
body:
  type: json
  content: |-
    {
        "email": "demo@example.test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing password returns 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Response explains the required input", function () {
          pm.expect(pm.response.json()).to.deep.equal({
              error: "INVALID_INPUT",
              message: "Provide a valid email address and a non-empty password."
          });
      });
    language: text/javascript
settings:
  disableCookies: true
order: 1829
