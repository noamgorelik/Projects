$kind: http-request
url: "{{baseUrl}}/api/subscription/cancel"
method: POST
body:
  type: json
  content: |-
    {
        "confirm": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Unconfirmed cancellation returns 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Response explains the confirmation requirement", function () {
          pm.expect(pm.response.json()).to.deep.equal({
              error: "INVALID_CONFIRMATION",
              message: "Send JSON with confirm set to true to cancel your subscription."
          });
      });
    language: text/javascript
order: 10228
