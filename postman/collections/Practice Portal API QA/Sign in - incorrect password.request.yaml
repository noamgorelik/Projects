$kind: http-request
url: "{{baseUrl}}/api/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "demo@example.test",
      "password": "WrongPassword!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Incorrect password returns 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response contains the expected credentials error", function () {
          pm.expect(pm.response.json()).to.deep.equal({
              error: "INVALID_CREDENTIALS",
              message: "Email or password is incorrect."
          });
      });
    language: text/javascript
settings:
  disableCookies: true
order: 1777
