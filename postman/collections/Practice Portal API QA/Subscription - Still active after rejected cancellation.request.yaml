$kind: http-request
url: "{{baseUrl}}/api/subscription"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Authenticated subscription lookup returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Subscription is Practice Plus and Active", function () {
          pm.expect(pm.response.json()).to.deep.equal({
              subscription: {
                  plan: "Practice Plus",
                  status: "active"
              }
          });
      });
    language: text/javascript
order: 10694
