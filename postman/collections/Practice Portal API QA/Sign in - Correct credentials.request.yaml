$kind: http-request
description: ""
url: "{{baseUrl}}/api/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "demo@example.test",
      "password": "Practice123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Correct sign-in returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response contains the expected message and account", function () {
          pm.expect(pm.response.json()).to.deep.equal({
              message: "Sign-in successful.",
              user: {
                  email: "demo@example.test"
              }
          });
      });

      pm.test("Session cookie is available for the logout check", function () {
          const header = pm.response.headers.get("Set-Cookie") || "";
          const match = header.match(/practice_session=([^;]+)/);

          pm.expect(match, "Expected a practice_session cookie").not.to.equal(null);
          pm.collectionVariables.set("sessionBeforeLogout", match[1]);
      });
    language: text/javascript
order: 2000
