$kind: http-request
url: "{{baseUrl}}/api/subscription/cancel"
method: POST
body:
  type: json
  content: |-
    {
        "confirm": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Request without a session returns 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response contains the expected authentication error", function () {
          pm.expect(pm.response.json()).to.deep.equal({
              error: "UNAUTHENTICATED",
              message: "Please sign in."
          });
      });
    language: text/javascript
settings:
  disableCookies: true
order: 1958
