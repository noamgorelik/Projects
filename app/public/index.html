<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice Portal — Sign in</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Practice Portal</h1>
      <p>A fictional SaaS subscription portal. This demo only checks credentials.</p>
      <form id="sign-in-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="practice-note">Practice account: demo@example.test<br>Password: Practice123!</p>
    </main>
  </body>
</html>
