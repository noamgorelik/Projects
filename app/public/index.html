<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice Portal — Sign in</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Practice Portal</h1>
      <p>A fictional SaaS subscription portal with practice sessions.</p>
      <form id="sign-in-form" hidden>
        <fieldset id="sign-in-fields" disabled>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Sign in</button>
        </fieldset>
      </form>
      <section id="account" hidden aria-labelledby="account-heading">
        <h2 id="account-heading">Your account</h2>
        <p id="account-email"></p>
        <button id="sign-out" type="button">Sign out</button>
      </section>
      <p id="message" role="status" aria-live="polite">Checking your session…</p>
      <p class="practice-note">Practice account: demo@example.test<br>Password: Practice123!</p>
    </main>
  </body>
</html>
