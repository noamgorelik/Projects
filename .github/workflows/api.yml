name: API checks

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:api
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-results
          path: |
            playwright-report/api/
            test-results/api/
          retention-days: 7
          if-no-files-found: ignore
